<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>DS4Gopher — Steam-like Config</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #171a21; color: #c6d4df; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .container { display: flex; gap: 20px; max-width: 1200px; width: 100%; }
  
  /* Bagian Kiri: Preview Controller */
  .left-panel { width: 350px; background: #1b2838; padding: 20px; border-radius: 8px; height: fit-content; }
  .left-panel h2 { color: #66c0f4; margin-top: 0; font-size: 18px; text-transform: uppercase; }
  .controller-img { width: 100%; height: 200px; background: #2a475e; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: #8f98a0; font-style: italic; }
  .analog-settings { margin-top: 20px; border-top: 1px solid #2a475e; padding-top: 20px; }
  .setting { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
  .setting label { font-size: 13px; color: #8f98a0; }
  .setting select, .setting input { background: #2a475e; border: 1px solid #66c0f4; color: #fff; padding: 5px; border-radius: 3px; outline: none; }

  /* Bagian Kanan: List Bindings */
  .right-panel { flex: 1; background: #1b2838; padding: 20px; border-radius: 8px; }
  .right-panel h2 { color: #66c0f4; margin-top: 0; font-size: 18px; text-transform: uppercase; }
  
  .grid-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .binding-row { display: flex; flex-direction: column; background: #2a475e; padding: 10px; border-radius: 4px; border-left: 4px solid #66c0f4; }
  .binding-row label { font-weight: bold; margin-bottom: 5px; color: #fff; font-size: 14px; }
  .binding-row select { padding: 8px; background: #171a21; color: #66c0f4; border: 1px solid #000; border-radius: 3px; font-family: monospace; font-size: 14px; }
  
  .footer { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
  button { background: linear-gradient( to bottom, #a4d007 5%, #536904 95%); color: #fff; border: none; padding: 10px 20px; font-size: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-shadow: 1px 1px 0px rgba(0,0,0,0.3); }
  button:hover { background: linear-gradient( to bottom, #b6e40c 5%, #6b8a05 95%); }
  button.secondary { background: #2a475e; border: 1px solid #66c0f4; text-shadow: none; color: #66c0f4; }
  button.secondary:hover { background: #3a5a73; }
  
  /* Preview Code */
  .code-preview { grid-column: span 2; background: #000; color: #a4d007; padding: 10px; font-family: monospace; font-size: 12px; white-space: pre; height: 150px; overflow-y: auto; border-radius: 4px; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
  <!-- KIRI -->
  <div class="left-panel">
    <h2>Analog Settings</h2>
    <div class="setting">
      <label>Left Stick</label>
      <select id="leftStickFunc" onchange="updateIni()">
        <option value="Mouse">Mouse</option>
        <option value="Scroll">Scroll</option>
        <option value="None">None</option>
      </select>
    </div>
    <div class="setting">
      <label>Right Stick</label>
      <select id="rightStickFunc" onchange="updateIni()">
        <option value="Mouse">Mouse</option>
        <option value="Scroll">Scroll</option>
        <option value="None">None</option>
      </select>
    </div>
    <div class="setting">
      <label>Deadzone</label>
      <input type="number" id="deadzone" value="8000" onchange="updateIni()">
    </div>
    
    <h2>Actions</h2>
    <button class="secondary" onclick="resetDefaults()" style="width:100%; margin-bottom:10px;">Reset to Default</button>
    <button onclick="downloadIni()" style="width:100%;">Download config.ini</button>
  </div>

  <!-- KANAN -->
  <div class="right-panel">
    <h2>Controller Bindings</h2>
    <div class="grid-list" id="bindingsContainer">
      <!-- Javascript akan mengisi ini -->
    </div>
    <div class="code-preview" id="iniPreview">Preview config.ini...</div>
  </div>
</div>

<script>
// Daftar tombol controller
const buttons = [
  "Cross", "Circle", "Square", "Triangle",
  "L1", "R1", "L2", "R2",
  "Share", "Options", "L3", "R3", "PS", "Touchpad",
  "DpadUp", "DpadDown", "DpadLeft", "DpadRight"
];

// Daftar aksi (Keyboard & Mouse)
const actions = {
  "None": "None",
  "MouseLeft": "Mouse Left Click",
  "MouseRight": "Mouse Right Click",
  "MouseMiddle": "Mouse Middle Click",
  "Key:0x20": "Keyboard: Space",
  "Key:0x0D": "Keyboard: Enter",
  "Key:0x1B": "Keyboard: Esc",
  "Key:0x09": "Keyboard: Tab",
  "Key:0x08": "Keyboard: Backspace",
  "Key:0x10": "Keyboard: Shift",
  "Key:0x11": "Keyboard: Ctrl",
  "Key:0x12": "Keyboard: Alt",
  "Key:0x5B": "Keyboard: Windows",
  "Key:0x26": "Keyboard: Arrow Up",
  "Key:0x28": "Keyboard: Arrow Down",
  "Key:0x25": "Keyboard: Arrow Left",
  "Key:0x27": "Keyboard: Arrow Right",
  "Key:0x74": "Keyboard: F5 (Refresh)",
  "Key:0x41": "Keyboard: A",
  "Key:0x42": "Keyboard: B",
  "Key:0x43": "Keyboard: C",
  "Key:0x44": "Keyboard: D",
  "Key:0x57": "Keyboard: W",
  "Key:0x41+0x43": "Combo: Ctrl + C", // A+ C bukan Ctrl+C, kita asumsikan C saja
  "Key:0x11+0x43": "Combo: Ctrl + C",
  "Key:0x11+0x56": "Combo: Ctrl + V"
};

// Default Mapping (seperti Steam)
let defaultMap = {
  "Cross": "MouseLeft",
  "Circle": "MouseRight",
  "Square": "Key:0x20", // Space
  "Triangle": "Key:0x1B", // Esc
  "L1": "Key:0x10", // Shift
  "R1": "Key:0x11", // Ctrl
  "L2": "Key:0x1B", // Esc
  "R2": "Key:0x0D", // Enter
  "Share": "Key:0x5B", // Win Key
  "Options": "Key:0x09", // Tab
  "L3": "None",
  "R3": "Key:0x74", // F5
  "PS": "None",
  "Touchpad": "None",
  "DpadUp": "Key:0x26",
  "DpadDown": "Key:0x28",
  "DpadLeft": "Key:0x25",
  "DpadRight": "Key:0x27"
};

let currentMap = { ...defaultMap };

function initUI() {
  const container = document.getElementById('bindingsContainer');
  container.innerHTML = '';

  buttons.forEach(btn => {
    const div = document.createElement('div');
    div.className = 'binding-row';
    
    let optionsHTML = '';
    for (const [val, label] of Object.entries(actions)) {
      const selected = (currentMap[btn] === val) ? 'selected' : '';
      optionsHTML += `<option value="${val}" ${selected}>${label}</option>`;
    }

    div.innerHTML = `
      <label>${btn}</label>
      <select onchange="updateBinding('${btn}', this.value)">
        ${optionsHTML}
      </select>
    `;
    container.appendChild(div);
  });

  // Tambahkan kotak preview di grid
  const previewDiv = document.createElement('div');
  previewDiv.className = 'code-preview';
  previewDiv.id = 'iniPreview';
  container.appendChild(previewDiv);

  updateIni();
}

function updateBinding(button, value) {
  currentMap[button] = value;
  updateIni();
}

function updateIni() {
  let ini = `[General]\n`;
  ini += `Deadzone = ${document.getElementById('deadzone').value}\n`;
  ini += `Speed1 = 6\nSpeed2 = 14\nSpeed3 = 28\n\n`;

  ini += `[Analog]\n`;
  ini += `LeftStick = ${document.getElementById('leftStickFunc').value}\n`;
  ini += `RightStick = ${document.getElementById('rightStickFunc').value}\n\n`;

  ini += `[Bindings]\n`;
  for (const btn of buttons) {
    ini += `${btn} = ${currentMap[btn]}\n`;
  }

  const preview = document.getElementById('iniPreview');
  if (preview) preview.textContent = ini;
  return ini;
}

function downloadIni() {
  const ini = updateIni();
  const blob = new Blob([ini], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'config.ini';
  a.click();
  URL.revokeObjectURL(url);
}

function resetDefaults() {
  currentMap = { ...defaultMap };
  document.getElementById('leftStickFunc').value = 'Mouse';
  document.getElementById('rightStickFunc').value = 'Scroll';
  document.getElementById('deadzone').value = 8000;
  initUI();
}

// Start
initUI();
</script>
</body>
</html>
